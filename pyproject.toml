[project]
name = "business-banking-rm-copilot-prototype"
version = "0.1.0"
description = "Controlled RM briefing copilot over fictional business banking data"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb>=1.5,<2",
  "fastapi>=0.115,<1",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "streamlit>=1.65,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
rm-copilot-evaluate = "rm_copilot.cli:evaluate_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rm_copilot"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
